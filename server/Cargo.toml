[package]
name = "lawful-overlay-server"
version = "0.2.0"
edition = "2021"
description = "LawfulOverlay: Discord bot + authenticated WebSocket broadcaster"

[lib]
name = "lawful_overlay_server"
path = "src/lib.rs"

[[bin]]
name = "lawful-overlay-server"
path = "src/main.rs"

[[bin]]
name = "mock-server"
path = "src/bin/mock.rs"

[dependencies]
dotenvy = "0.15.7"
futures-util = "0.3.34"
rand = "0.10.3"
regex = "1.13.1"
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "http"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
