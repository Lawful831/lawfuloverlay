[package]
name = "lawful-overlay"
version = "0.8.0"
edition = "2021"
description = "LawfulOverlay: transparent always-on-top Discord chat overlay"
license = "MIT"
repository = "https://github.com/Lawful831/lawfuloverlay"
build = "build.rs"

[dependencies]
base64 = "0.22.1"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "links", "wgpu"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["http", "image", "gif", "webp"] }
epaint = { version = "0.37.0", default-features = false, features = ["color_fonts"] }
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
msedge-tts = "0.4.1"
# Direct dependency only to pick the TLS crypto backend: both ring and aws-lc-rs
# end up enabled by other crates, and rustls then refuses to choose by itself.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }
# COM bindings for the built-in Windows voice (SAPI), used in-process.
windows = { version = "0.62.2", features = ["Win32_Media_Speech", "Win32_System_Com"] }

# Embeds the version info and application manifest into the exe.
[target."cfg(windows)".build-dependencies]
winresource = "0.1"
