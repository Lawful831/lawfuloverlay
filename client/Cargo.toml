[package]
name = "lawful-overlay"
version = "0.2.0"
edition = "2021"
description = "LawfulOverlay: transparent always-on-top Discord chat overlay"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
futures-util = "0.3.34"
msedge-tts = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_Graphics_Dwm"] }
